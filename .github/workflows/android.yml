name: Build Admin Messenger Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-admin-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate and Repair Gradle Wrapper
        run: |
          if ! jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "WARNING: Gradle wrapper JAR is invalid, missing or corrupted! Downloading fresh official Gradle Wrapper..."
            mkdir -p gradle/wrapper

            GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/' | sed 's/-all//')

            if [ -z "$GRADLE_VERSION" ]; then
              GRADLE_VERSION="8.14.3"
            fi

            curl -L \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

            echo "Gradle Wrapper repaired successfully."
          else
            echo "SUCCESS: Gradle Wrapper JAR is valid."
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Validate Dependencies
        run: ./gradlew dependencies --no-daemon

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../app.apk

      - name: Upload Admin Messenger APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app.apk
          path: app.apk
          if-no-files-found: error
