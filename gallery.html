</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container">
      <a href="./" class="site-logo">Chitron's Archive</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="./" data-i18n="nav.home">Home</a>
        <a href="./about.html" data-i18n="nav.about">About</a>
        <a href="./writing.html" data-i18n="nav.writing">Writing</a>
        <a href="./gallery.html" class="active" data-i18n="nav.gallery">Gallery</a>
      </nav>
      <div class="nav-right">
        <button class="lang-toggle" aria-label="Switch language (EN / বাংলা)" title="Switch language">
          <span class="lang-opt lang-en active">EN</span>
          <span class="lang-sep">/</span>
          <span class="lang-opt lang-bn">বাং</span>
        </button>
        <button class="theme-toggle" aria-label="Switch to dark mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="mobile-menu-btn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MOBILE NAVIGATION -->
  <div class="mobile-nav" aria-hidden="true">
    <div class="mobile-nav-header">
      <a href="./" class="site-logo">Chitron's Archive</a>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="lang-toggle mobile-lang-toggle" aria-label="Switch language (EN / বাংলা)">
          <span class="lang-opt lang-en active">EN</span>
          <span class="lang-sep">/</span>
          <span class="lang-opt lang-bn">বাং</span>
        </button>
        <button class="mobile-nav-close" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <nav aria-label="Mobile navigation">
      <a href="./" data-i18n="nav.home">Home</a>
      <a href="./about.html" data-i18n="nav.about">About</a>
      <a href="./writing.html" data-i18n="nav.writing">Writing</a>
      <a href="./gallery.html" class="active" data-i18n="nav.gallery">Gallery</a>
    </nav>
  </div>

  <!-- MAIN CONTENT -->
  <main class="gallery-page">
    <div class="container container--wide">
      <nav class="breadcrumb-nav" aria-label="Breadcrumbs" style="margin-bottom:16px;font-size:13px;color:var(--text-tertiary);">
        <a href="./" style="color:var(--text-secondary);" data-i18n="bc.home">Home</a>
        <span style="margin:0 6px;">/</span>
        <span aria-current="page" style="color:var(--text);" data-i18n="bc.gallery">Gallery</span>
      </nav>

      <header class="gallery-page-header">
        <h1 class="gallery-title" id="gallery-title" data-i18n="gallery.title">Photo Gallery</h1>
        <p class="gallery-desc" id="gallery-subtitle" data-i18n="gallery.subtitle">Visual moments, captures, workspaces, and photographic memories.</p>

        <div class="gallery-filter-wrapper">
          <div class="gallery-filter-chips" id="gallery-category-chips" role="tablist" aria-label="Filter photos by category">
            <button class="gallery-filter-chip active" data-category="all" role="tab" aria-selected="true" data-i18n="gallery.all">All Photos</button>
          </div>
          <div class="gallery-count-badge" id="gallery-count"></div>
        </div>
      </header>

      <!-- Photo Gallery Masonry Grid -->
      <section id="gallery-grid" class="gallery-photos-masonry" aria-live="polite">
        <div class="loading" style="grid-column:1/-1;text-align:center;padding:48px 0;" data-i18n="gallery.loading">Loading photos...</div>
      </section>
    </div>
  </main>

  <!-- LIGHTBOX MODAL -->
  <div id="gallery-lightbox" class="lightbox-modal" role="dialog" aria-modal="true" aria-label="Photo Lightbox" aria-hidden="true">
    <div class="lightbox-topbar">
      <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
      <div class="lightbox-actions">
        <button type="button" class="lightbox-btn" id="lightbox-fullscreen-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
        <button type="button" class="lightbox-btn" id="lightbox-close-btn" title="Close" aria-label="Close photo lightbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="lightbox-body" id="lightbox-body">
      <button type="button" class="lightbox-nav-btn prev" id="lightbox-prev-btn" title="Previous photo" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <img src="" alt="" class="lightbox-main-img" id="lightbox-img">

      <button type="button" class="lightbox-nav-btn next" id="lightbox-next-btn" title="Next photo" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div class="lightbox-footer">
      <h2 class="lightbox-caption-title" id="lightbox-title"></h2>
      <p class="lightbox-caption-desc" id="lightbox-caption"></p>
      <div class="lightbox-caption-meta" id="lightbox-meta"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">

        <a href="./feed.xml" data-i18n="footer.rss">RSS</a>
        <a href="./sitemap.xml" data-i18n="footer.sitemap">Sitemap</a>
      </div>
    </div>
  </footer>

  <script src="./js/gallery.js"></script>
</body>
</html>
